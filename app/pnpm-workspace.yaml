# This project is a single package, not a monorepo. The file exists only to hold
# pnpm settings, and pnpm 10 refuses to install unless `packages` is present.
packages: []

# Build scripts we allow to run. pnpm 11 reads `allowBuilds`; pnpm 10, which is
# what Cloudflare's build image ships, reads `onlyBuiltDependencies`. Both are
# listed so the install behaves the same locally and on Cloudflare.
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - workerd

minimumReleaseAgeExclude:
  - '@next/env@16.3.0'
  - '@next/eslint-plugin-next@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - eslint-config-next@16.3.0
  - next@16.3.0
